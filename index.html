<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Costante">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0a07" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="costante-180.png">
<link rel="icon" href="costante-192.png">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<title>Costante</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: game-style app shell. Sticky header with level, streak and medal counters; stacked rounded cards; fixed bottom tab bar.
   One warm dark look. Amber is XP and progress; day types are red (push), blue (pull), violet (legs); ranks use their own tier colours. */
:root{
  color-scheme:dark;
  --bg:#15100a; --surface:#221910; --surface-2:#34271a; --fg:#fff4e2; --muted:#b9a488; --line:#4a3924;
  --push:#ff6f5e; --pull:#5ea6ff; --legs:#b792ff; --rest:#9c8a72; --good:#55d68a;
  --push-soft:#3b1f19; --pull-soft:#18283f; --legs-soft:#2b2142; --rest-soft:#2a2118;
  --xp:#f6a51e; --xp-hi:#ffd27a; --xp-soft:#40290a; --warn:#ff9a3c; --ink:#1b1206;
  --t-bronze:#cf8a4e; --t-silver:#b7c3cf; --t-gold:#f7c93f; --t-plat:#43d8c9; --t-diamond:#7ea4ff; --t-champ:#dc7ff5;
  --skin:#eadfce; --nodata:#b9ab96; --hair:#8d7a63;
  --overlay:rgba(0,0,0,.7);
  --display:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(150px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto}
p{margin:0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
button{font-family:var(--body);color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

/* Header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.55rem,7.5vw,2.1rem);white-space:nowrap;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.01em}
h2{font-family:var(--display);font-weight:800;font-size:1.8rem;line-height:1.05;margin:0;text-transform:uppercase;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:1.2rem;margin:0;text-transform:uppercase;letter-spacing:.02em}
.lvl{border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;padding:6px 10px 7px;
  display:flex;flex-direction:column;gap:4px;min-width:112px;flex:0 0 auto;cursor:pointer;text-align:left}
.lvl-top{display:flex;align-items:baseline;gap:6px;font-weight:700;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.lvl-top b{font-family:var(--display);font-size:1.2rem;font-weight:800;letter-spacing:0}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--xp);border-radius:3px;transition:width .4s}

/* Day strip */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.day{border:0;border-radius:10px;padding:8px 0 7px;background:var(--surface);cursor:pointer;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:inset 0 0 0 1px var(--line)}
.day b{font-family:var(--display);font-weight:800;font-size:1.05rem;line-height:1}
.day span{font-size:.6rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.day i{width:18px;height:4px;border-radius:2px;background:var(--c)}
.day[aria-pressed="true"]{background:var(--c);box-shadow:none}
.day[aria-pressed="true"] b,.day[aria-pressed="true"] span{color:#fff}
.day[aria-pressed="true"] i{background:#fff}
.day .done{position:absolute;top:-5px;right:-4px;width:17px;height:17px;border-radius:50%;background:var(--xp);color:#fff;
  font-size:.65rem;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}

/* Views */
.view{margin-top:14px;display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 0 0 1px var(--line);min-width:0}
.panel ul,.panel ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* Session hero */
.hero{border-radius:16px;padding:18px;background:var(--soft);display:flex;flex-direction:column;gap:8px}
.hero .tag{font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.meta{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.meta strong{color:var(--fg);font-variant-numeric:tabular-nums}
.hero .bar{background:color-mix(in srgb,var(--surface) 70%,transparent)}
.hero .bar>i{background:var(--c)}

/* Exercise card */
.ex{background:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 0 0 1px var(--line)}
.ex.complete{box-shadow:inset 0 0 0 2px var(--xp)}
.ex-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.ex-name{font-weight:700;font-size:1.05rem;line-height:1.3;min-width:0}
.ex-name small{display:block;font-weight:400;font-size:.85rem;color:var(--muted);margin-top:2px}
.scheme{font-family:var(--display);font-weight:800;font-size:1.25rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.chip.new{background:var(--soft);color:var(--c)}
.rank{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px 3px 6px;border-radius:999px;background:var(--surface-2);color:var(--fg)}
.rank::before{content:"";width:9px;height:9px;transform:rotate(45deg);border-radius:2px;background:var(--tier)}
.coach{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;background:var(--surface-2);border-radius:10px;padding:8px 10px}
.coach b{color:var(--fg)}
.coach.up{background:var(--xp-soft)}
.coach.up b{color:var(--xp)}
.last{font-size:.82rem;color:var(--muted)}
.rows{display:flex;flex-direction:column;gap:6px}
.srow{display:grid;grid-template-columns:22px minmax(0,1fr) 14px minmax(0,1fr) 46px;gap:6px;align-items:center}
.srow.nokg{grid-template-columns:22px minmax(0,1fr) 46px}
.srow .n{font-family:var(--display);font-weight:800;color:var(--muted);text-align:center}
.srow .x{color:var(--muted);text-align:center;font-size:.85rem}
.field{position:relative;min-width:0}
.field input{width:100%;font:600 16px var(--body);padding:9px 34px 9px 10px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--fg);font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.field span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:.72rem;font-weight:700;color:var(--muted);pointer-events:none;text-transform:uppercase}
.tick{width:46px;height:42px;border-radius:10px;border:2px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center}
.tick svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:3}
.tick[aria-pressed="true"]{background:var(--c);border-color:var(--c)}
.tick[aria-pressed="true"] svg{stroke:#fff}
.srow.done input{opacity:.7}
.sets{display:flex;gap:8px;flex-wrap:wrap}
.set{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--muted);
  font-family:var(--display);font-weight:800;font-size:1.05rem;cursor:pointer;display:grid;place-items:center}
.set[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}

/* Buttons */
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:1rem;cursor:pointer;background:var(--fg);color:var(--bg)}
.btn.c{background:var(--c);color:#fff}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.danger{background:var(--push);color:#fff}
.btn.sm{padding:9px 12px;font-size:.9rem;border-radius:10px}
.link{border:0;background:none;color:var(--muted);font:600 .85rem var(--body);text-decoration:underline;cursor:pointer;padding:4px 0;align-self:flex-start}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border-radius:12px;padding:10px;box-shadow:inset 0 0 0 1px var(--line);min-width:0}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
@media (max-width:380px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Progress */
select{width:100%;font:600 16px var(--body);padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg)}
.rankcard{display:flex;gap:14px;align-items:center}
.gem{flex:0 0 auto;width:56px;height:56px;display:grid;place-items:center}
.gem svg{width:56px;height:56px}
.tiers{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.tiers i{height:6px;border-radius:3px;background:var(--surface-2)}
.tiers i.on{background:var(--tier)}
.chart{width:100%;overflow:visible;display:block}
.chart text{font-family:var(--body);font-size:11px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--fg);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ln.avg{stroke:var(--xp)}
.chart .pt{fill:var(--surface);stroke:var(--fg);stroke-width:2}
.chart .pt.pr{fill:var(--xp);stroke:var(--surface)}
.chart .pt.raw{fill:var(--muted);stroke:var(--surface);stroke-width:2}
.chart .hit{fill:transparent;cursor:pointer}
.chart .tipbg{fill:var(--fg)}
.chart .tiptx{fill:var(--bg);font-weight:700;font-size:11px}
.chart .endlbl{fill:var(--fg);font-weight:700;font-size:12px}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;background:var(--fg)}
.legend i.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.legend i.g{background:var(--xp)}
.hist{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:4.6rem minmax(0,1fr) auto;gap:10px;padding-block:9px;border-top:1px solid var(--line);align-items:baseline;font-size:.9rem}
.hrow:first-child{border-top:0}
.hrow .d{color:var(--muted);font-variant-numeric:tabular-nums}
.hrow .s{min-width:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.hrow .e{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.prflag{display:inline-block;margin-left:6px;font-size:.62rem;font-weight:800;letter-spacing:.06em;padding:1px 6px;border-radius:999px;background:var(--xp);color:#fff;vertical-align:1px}
.empty{padding:18px;border-radius:14px;border:2px dashed var(--line);color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:6px}
.empty b{color:var(--fg)}

/* Profile */
.levelcard{display:flex;gap:16px;align-items:center}
.biglvl{flex:0 0 auto;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;position:relative}
.biglvl svg{position:absolute;inset:0;width:84px;height:84px;transform:rotate(-90deg)}
.biglvl b{font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1}
.ring-bg{fill:none;stroke:var(--surface-2);stroke-width:8}
.ring-fg{fill:none;stroke:var(--xp);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .5s}
.bwform{display:flex;gap:8px}
.bwform .field{flex:1}
.pace{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--surface-2)}
.pace.ok{background:var(--xp-soft);color:var(--xp)}
.pace.warn{color:var(--warn)}
.bwlist{display:flex;flex-direction:column}
.bwrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:7px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.bwrow:first-child{border-top:0}
.x-btn{border:0;background:none;color:var(--muted);cursor:pointer;font-size:.8rem;text-decoration:underline;padding:4px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:10px 6px;border-radius:12px;background:var(--surface-2);min-width:0}
.badge .hex{width:52px;height:58px;display:grid;place-items:center;position:relative}
.badge .hex svg{position:absolute;inset:0;width:52px;height:58px}
.badge .hex b{position:relative;font-family:var(--display);font-weight:800;font-size:1.05rem;color:#fff}
.badge .bn{font-size:.78rem;font-weight:700;line-height:1.2}
.badge .bp{font-size:.7rem;color:var(--muted);line-height:1.2}
.badge.locked .hex b{color:var(--muted)}
.badge.locked .bn{color:var(--muted)}
textarea{width:100%;min-height:90px;font:16px ui-monospace,Menlo,monospace;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* Plan */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);padding:4px;border-radius:12px}
.seg button{border:0;background:none;padding:9px 0;border-radius:9px;font-weight:700;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.row{display:grid;grid-template-columns:4.5rem 1fr;gap:10px;padding-block:8px;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row b{font-family:var(--display);font-weight:800;font-size:1.05rem;text-transform:uppercase}
.stage{display:flex;gap:12px;align-items:flex-start}
.stage .wk{flex:0 0 auto;font-family:var(--display);font-weight:800;font-size:.95rem;text-transform:uppercase;background:var(--surface-2);border-radius:8px;padding:4px 8px;white-space:nowrap}
.finding{display:flex;flex-direction:column;gap:4px;padding-block:10px;border-top:1px solid var(--line)}
.finding:first-of-type{border-top:0;padding-top:0}
.finding .what{font-weight:700}
.finding a{color:var(--pull);font-size:.85rem;font-weight:600;word-break:break-word}
.warnpanel{background:var(--push-soft)}
.warnpanel h3{color:var(--push)}

/* Tab bar, rest timer, toasts, modal */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.tab{border:0;background:none;color:var(--muted);font:700 .76rem var(--body);letter-spacing:.06em;text-transform:uppercase;padding:10px 0;border-radius:10px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--fg);background:var(--surface-2)}
.rest{position:fixed;z-index:7;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:12px;background:var(--fg);color:var(--bg);border-radius:999px;padding:8px 8px 8px 16px;box-shadow:0 6px 20px rgba(0,0,0,.25);white-space:nowrap}
.rest b{font-family:var(--display);font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums;min-width:3.2ch}
.rest span{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.rest button{border:0;border-radius:999px;padding:7px 12px;font-weight:700;font-size:.8rem;background:var(--bg);color:var(--fg);cursor:pointer}
.rest.go{background:var(--xp);color:#fff}
.toasts{position:fixed;z-index:20;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toast{max-width:460px;width:100%;background:var(--fg);color:var(--bg);border-radius:14px;padding:11px 14px;display:flex;gap:12px;align-items:center;
  box-shadow:0 8px 24px rgba(0,0,0,.28);animation:tin .3s ease-out}
.toast .tx{min-width:0;font-size:.9rem;line-height:1.3}
.toast .tx b{display:block;font-size:.95rem}
.toast .xpv{margin-left:auto;font-family:var(--display);font-weight:800;font-size:1.2rem;color:var(--xp);white-space:nowrap}
.toast .ico{flex:0 0 auto;width:30px;height:30px;border-radius:8px;background:var(--xp);display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#fff;font-size:.85rem}
@keyframes tin{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
.modal{position:fixed;inset:0;z-index:30;background:var(--overlay);display:grid;place-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:420px;max-height:100%;overflow:auto;background:var(--surface);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.burst{align-self:center;width:110px;height:110px;border-radius:50%;display:grid;place-items:center;background:var(--xp-soft);position:relative}
.burst b{font-family:var(--display);font-weight:800;font-size:3rem;line-height:1;color:var(--xp)}
.burst::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px dashed var(--xp);animation:spin 8s linear infinite;opacity:.6}
@keyframes spin{to{transform:rotate(360deg)}}
.sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sumgrid div{background:var(--surface-2);border-radius:10px;padding:10px;text-align:center}
.sumgrid b{display:block;font-family:var(--display);font-weight:800;font-size:1.4rem;font-variant-numeric:tabular-nums}
.sumgrid span{font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* Exercise editing */
.ex-top .opt{flex:0 0 auto;border:0;background:var(--surface-2);border-radius:10px;width:36px;height:32px;cursor:pointer;display:grid;place-items:center;margin-left:4px}
.ex-top .opt svg{width:18px;height:18px;fill:var(--muted)}
.ex-right{display:flex;align-items:flex-start;gap:2px}
.changed{background:var(--legs-soft);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.changed p b{color:var(--fg)}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.hero-actions button{border:0;border-radius:10px;padding:8px 12px;font-weight:700;font-size:.85rem;cursor:pointer;background:color-mix(in srgb,var(--surface) 75%,transparent);color:var(--fg)}
.addex{border:2px dashed var(--line);background:transparent;border-radius:14px;padding:14px;font-weight:700;font-size:1rem;color:var(--fg);cursor:pointer}
.menu{display:flex;flex-direction:column;gap:6px}
.menu button{border:0;text-align:left;background:var(--surface-2);border-radius:12px;padding:13px 14px;font-weight:700;font-size:1rem;cursor:pointer;color:var(--fg)}
.menu button.danger{color:var(--push)}
.menu button:disabled{opacity:.4;cursor:default}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:40px;height:40px;border-radius:10px;border:0;background:var(--surface-2);font-weight:800;font-size:1.2rem;cursor:pointer;color:var(--fg)}
.stepper b{min-width:2ch;text-align:center;font-family:var(--display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.txt{width:100%;font:600 16px var(--body);padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg)}
.pk-list{display:flex;flex-direction:column;gap:12px;max-height:46vh;overflow:auto;padding-right:2px}
.pk-group{display:flex;flex-direction:column;gap:4px}
.pk-item{border:0;text-align:left;background:var(--surface-2);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:baseline;color:var(--fg);font-weight:600;font-size:.95rem}
.pk-item small{color:var(--muted);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.formgrid label{display:flex;flex-direction:column;gap:4px;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:0}
.formgrid .full{grid-column:1/-1}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow .tn{font-weight:700;line-height:1.25;min-width:0}
.trow .tctl{display:flex;gap:6px;align-items:center}
.trow input{width:3.2rem;font:600 16px var(--body);padding:7px 6px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);text-align:center}
.trow input.reps{width:4.6rem}
.trow .tbtns{grid-column:1/-1;display:flex;gap:6px}
.trow .tbtns button{border:0;background:var(--surface-2);border-radius:8px;padding:6px 10px;font-weight:700;font-size:.8rem;cursor:pointer;color:var(--fg)}
.trow .tbtns button.danger{color:var(--push)}
.trow .tbtns button:disabled{opacity:.35;cursor:default}

/* Body map */
.bodymap{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bodymap figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.bodymap figcaption{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bodymap svg{width:100%;max-width:180px;height:auto;display:block}
.bodymap .skin{fill:var(--surface-2)}
.bodymap .mus{cursor:pointer}
.bodymap .mus *{stroke:var(--surface);stroke-width:1.4}
.bodymap .mus.nodata *{fill:var(--line)}
.bodymap .mus.sel *{stroke:var(--fg);stroke-width:2.4}
.tierlegend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.75rem;color:var(--muted)}
.tierlegend span{display:inline-flex;align-items:center;gap:5px}
.tierlegend i{width:10px;height:10px;border-radius:3px;background:var(--tier)}
.mrank{display:flex;flex-direction:column}
.mrow{display:grid;grid-template-columns:6.2rem minmax(0,1fr) auto;gap:10px;align-items:center;padding-block:7px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer;color:var(--fg);font-size:.9rem}
.mrow:first-child{border-top:0}
.mrow.sel{font-weight:700}
.mrow .mb{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.mrow .mb i{display:block;height:100%;border-radius:4px;background:var(--tier)}
.mrow .mv{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem;white-space:nowrap}
.mdetail{background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mdetail .exl{display:flex;flex-direction:column;gap:6px}
.mdetail .exl button{border:0;background:var(--surface);border-radius:10px;padding:9px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;color:var(--fg);font-weight:600;text-align:left}

/* ---- v4: game look ---- */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h2,h3{text-transform:none;letter-spacing:-.01em}
h2{font-size:1.6rem;font-weight:800}
h3{font-size:1.15rem;font-weight:800}
h3.sect{font-size:1.35rem;margin-top:6px}
.panel,.ex{border-radius:18px}
.hero{border-radius:20px}
.btn{background:var(--xp);color:var(--ink);border-radius:14px;font-weight:800}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.c{color:var(--ink)}
.btn.danger{background:var(--push);color:var(--ink)}
.btn:disabled{opacity:.45}
.tick[aria-pressed="true"] svg,.set[aria-pressed="true"]{stroke:var(--ink);color:var(--ink)}
.day[aria-pressed="true"] b,.day[aria-pressed="true"] span{color:var(--ink)}
.day[aria-pressed="true"] i{background:var(--ink)}
.day .done,.prflag{background:var(--xp);color:var(--ink)}
.toast{background:var(--surface-2);color:var(--fg);box-shadow:0 0 0 1.5px var(--xp),0 10px 28px rgba(0,0,0,.5)}
.toast .ico{color:var(--ink)}
.rest{background:var(--surface-2);color:var(--fg);box-shadow:0 0 0 1.5px var(--line),0 8px 22px rgba(0,0,0,.5)}
.rest button{background:var(--xp);color:var(--ink)}
.rest.go{background:var(--xp);color:var(--ink)}
.badge .hex b{color:var(--ink)}
.badge.locked .hex b{color:var(--muted)}
.rank{color:var(--fg)}
.chart .pt.pr{stroke:var(--bg)}
.scheme,.stat b,.sumgrid b{font-weight:800}
.note{font-size:.82rem;color:var(--muted);padding:0 4px}

/* Header */
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lvl{display:flex;flex-direction:row;align-items:center;gap:10px;min-width:0;flex:0 1 auto;padding:5px 14px 5px 5px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--xp)}
.lvl-n{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:var(--xp);color:var(--ink);display:grid;place-items:center;font-weight:900;font-size:1.1rem}
.lvl-r{display:flex;flex-direction:column;gap:5px;min-width:112px}
.lvl-top{display:block;font-size:.82rem;font-weight:800;letter-spacing:0;text-transform:none;white-space:nowrap}
.lvl .bar{height:7px;border-radius:4px}
.ctrs{display:flex;gap:14px;flex:0 0 auto}
.ctr{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.ctr svg{width:24px;height:24px;fill:var(--line)}
.ctr.on{color:var(--fg)}
.ctr.on svg{fill:var(--xp)}

/* Tab bar */
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;font-size:.7rem;text-transform:none;letter-spacing:0;font-weight:700}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--xp);background:var(--xp-soft)}
body{padding-bottom:calc(160px + env(safe-area-inset-bottom,0px))}
.rest{bottom:calc(88px + env(safe-area-inset-bottom,0px))}

/* Warm-up and drop sets */
.srow.t-w,.srow.t-d{grid-template-columns:22px minmax(0,1fr) 14px minmax(0,1fr) 46px 28px;border-radius:10px;padding:3px 0}
.srow.nokg.t-w,.srow.nokg.t-d{grid-template-columns:22px minmax(0,1fr) 46px 28px}
.srow.t-w .n{color:var(--pull)}
.srow.t-d .n{color:var(--push)}
.srow.t-w .field input{border-color:color-mix(in srgb,var(--pull) 55%,var(--line))}
.srow.t-d .field input{border-color:color-mix(in srgb,var(--push) 55%,var(--line))}
.rmx{border:0;background:none;color:var(--muted);font-size:1.3rem;line-height:1;cursor:pointer;padding:4px 0;width:28px}
.xtra{display:flex;gap:8px;flex-wrap:wrap}
.xtra button{border:1.5px dashed var(--line);background:none;color:var(--muted);border-radius:10px;padding:7px 12px;font-weight:700;font-size:.82rem;cursor:pointer}
.rurow{display:flex;align-items:center;gap:10px;padding-block:4px;line-height:1.25}

/* Ranks */
.subtabs{display:flex;gap:22px;border-bottom:1.5px solid var(--line);overflow-x:auto;padding:0 2px}
.subtabs button{border:0;background:none;color:var(--muted);font-weight:800;font-size:1.05rem;padding:8px 0 10px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.subtabs button[aria-selected="true"]{color:var(--xp);border-bottom-color:var(--xp)}
.overall{flex-direction:row;align-items:center;justify-content:space-between;gap:14px}
.ov-l{display:flex;flex-direction:column;gap:3px;min-width:0}
.ov-l b{color:var(--fg)}
.overall>svg{flex:0 0 auto}
.bodymap svg{max-width:170px}
.bodymap .skin *{fill:var(--skin)}
.bodymap .hair{fill:var(--hair)}
.bodymap .mus *{stroke:var(--bg);stroke-width:1.1;stroke-linejoin:round}
.bodymap .mus.nodata *{fill:var(--nodata)}
.bodymap .mus.sel *{stroke:var(--fg);stroke-width:2.6}
.bodymap .mline{fill:none;stroke:var(--bg);stroke-width:.9;opacity:.45;pointer-events:none}
.acc{background:var(--surface);border-radius:18px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.acc-h{width:100%;border:0;background:none;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;text-align:left;color:var(--fg)}
.acc-h>svg:first-child{flex:0 0 auto}
.acc-t{display:flex;flex-direction:column;min-width:0;flex:1}
.acc-t b{font-size:1.15rem;font-weight:800}
.acc-t span{font-size:.88rem;color:var(--muted)}
.chev{width:22px;height:22px;fill:none;stroke:var(--muted);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.acc.open .chev{transform:rotate(180deg)}
.acc-b{padding:0 14px 12px;display:flex;flex-direction:column;gap:4px}
.mrow{grid-template-columns:12px minmax(0,1fr) auto;border-top:1px solid var(--line);padding-block:10px;font-weight:600}
.mrow .sw{width:12px;height:12px;border-radius:4px;background:var(--tier)}
.mrow .mv{color:var(--fg);font-size:.85rem;font-weight:700}
.mdetail .exl button{color:var(--fg)}
.nextrank{background:var(--surface-2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:9px}
.nr-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.nr-t{color:var(--xp);font-variant-numeric:tabular-nums}
.nextrank .bar{height:9px;border-radius:5px;background:var(--bg)}
.avgrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.avgcard{background:var(--surface);border-radius:18px;box-shadow:inset 0 0 0 1px var(--line);padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.avgcard b{font-size:1.1rem;font-weight:800}
.avgcard svg{align-self:center;margin-top:10px}
.wkrow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--surface-2);border-radius:14px;padding:10px 6px}
.wkd{display:flex;flex-direction:column;align-items:center;gap:5px}
.wkd small{color:var(--muted);font-weight:700;font-size:.78rem}
.wkd i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.85rem;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line)}
.wkd i.on{background:var(--xp);color:var(--ink);box-shadow:none}
.wkd.today i{box-shadow:inset 0 0 0 1.5px var(--line),0 0 0 2.5px var(--xp)}
.donutrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut{width:140px;height:140px;flex:0 0 auto}
.donut .dn{font-size:22px;font-weight:800;fill:var(--fg);font-family:var(--body)}
.donut .dl{font-size:11px;font-weight:700;fill:var(--muted);font-family:var(--body)}
.dleg{display:flex;flex-direction:column;gap:5px;flex:1;min-width:130px;font-size:.88rem;color:var(--muted)}
.dleg span{display:flex;align-items:center;gap:7px}
.dleg i{width:11px;height:11px;border-radius:3px;background:var(--tier)}
.dleg b{margin-left:auto;color:var(--fg);font-variant-numeric:tabular-nums}

/* Profile */
.prof{flex-direction:row;justify-content:space-between;align-items:center;gap:14px}
.prof-l{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
.ptitle{color:var(--xp);font-weight:800;font-size:1.1rem}
.prof-r{display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 auto;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal small{color:var(--muted);font-weight:700;font-size:.75rem;padding-bottom:2px}
.cd{aspect-ratio:1;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:.85rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.cd.on{background:var(--xp);color:var(--ink)}
.cd.today{box-shadow:inset 0 0 0 2px var(--xp-hi)}
.badges{margin-bottom:6px}


/* ---- v6: plans, back/save headers, profile picture ---- */
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-6px -6px 0}
.mh-b{border:0;background:none;color:var(--fg);font-weight:700;font-size:1rem;display:inline-flex;align-items:center;gap:2px;padding:8px 8px 8px 2px;cursor:pointer}
.mh-b svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.mh-s{border:0;background:var(--xp);color:var(--ink);font-weight:800;font-size:.95rem;border-radius:999px;padding:8px 16px;cursor:pointer}
.mh-sp{width:64px}
.mhead .eyebrow{text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{flex:0 0 auto;border-radius:50%;object-fit:cover;background:var(--xp);color:var(--ink);display:inline-grid;place-items:center;font-weight:900;box-shadow:0 0 0 2.5px var(--xp)}
img.lvl-n{object-fit:cover;padding:0}
.pe-pic{display:flex;flex-direction:column;align-items:center;gap:12px}
.pe-pic .btnrow{justify-content:center}
label.btn{display:inline-block;cursor:pointer}
.plist{display:flex;flex-direction:column;gap:8px}
.plrow{background:var(--surface-2);border-radius:14px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;align-items:center}
.plrow.on{box-shadow:inset 0 0 0 1.5px var(--xp)}
.pl-t{display:flex;flex-direction:column;min-width:0}
.pl-t b{font-size:1.05rem;overflow-wrap:anywhere}
.pl-t span{font-size:.85rem}
.pl-a{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:.72rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--surface);color:var(--muted);white-space:nowrap}
.pill.on{background:var(--xp);color:var(--ink)}
.switch{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--xp);flex:0 0 auto;margin-top:2px}
.switch span{display:flex;flex-direction:column;min-width:0}
.switch span span{font-size:.85rem}
.weekbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:8px 8px 8px 14px;box-shadow:inset 0 0 0 1px var(--line);font-size:.92rem}
.weekbar span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.weekbar button{border:0;background:var(--xp);color:var(--ink);font-weight:800;font-size:.85rem;border-radius:999px;padding:7px 14px;cursor:pointer;flex:0 0 auto}
.menu button:disabled{opacity:1}


/* ---- v7: gems, shop, challenges, photos ---- */
button.ctr{border:0;background:none;padding:0;cursor:pointer;font-family:var(--body)}
.gem-i{width:1em;height:1em;fill:var(--xp);vertical-align:-.12em;flex:0 0 auto}
.tab{font-size:.66rem}
.gembox{flex-direction:row;align-items:center;justify-content:space-between;gap:14px}
.gembox p{flex:1;min-width:0;max-width:220px}
.gemn{display:flex;align-items:center;gap:6px;font-size:1.9rem;font-weight:900;font-variant-numeric:tabular-nums}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.item{border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:16px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;color:var(--fg);font-family:var(--body);min-width:0}
.item.eq{box-shadow:inset 0 0 0 2px var(--xp)}
.item b{font-size:.95rem;text-align:center}
.pv{height:64px;display:grid;place-items:center}
.pv.big{height:auto;padding:6px 0}
.price{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-variant-numeric:tabular-nums;background:var(--surface-2);border-radius:999px;padding:4px 12px}
.price.short{opacity:.55}
.buy{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.sw-bn{width:112px;height:54px;border-radius:12px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.pv.big .sw-bn{width:220px;height:96px}
.sw-th{width:112px;height:54px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px}
.sw-th i{width:22px;height:22px;border-radius:50%}
.pv.big .sw-th{width:220px;height:96px}
.sw-ti{font-weight:800;color:var(--xp);font-size:1rem;text-align:center;padding:0 4px}
/* picture frames */
.avw{display:inline-grid;place-items:center;flex:0 0 auto;border-radius:50%;padding:calc(var(--s)*.075);background:var(--xp);position:relative}
.avw .avatar{box-shadow:0 0 0 2px var(--surface)}
.fr-steel{background:conic-gradient(#eef3f8,#8b98a6,#eef3f8,#8b98a6,#eef3f8)}
.fr-ember{background:linear-gradient(135deg,#ffb23c,#ff4d2e)}
.fr-aqua{background:linear-gradient(135deg,#43d8c9,#3a7bff)}
.fr-toxic{background:linear-gradient(135deg,#c6ff3d,#18c964)}
.fr-royal{background:conic-gradient(#b48cff,#ffd24a,#b48cff,#ffd24a,#b48cff)}
.fr-prism{background:conic-gradient(#ff5d52,#ffd24a,#6fd44a,#35b6ff,#b48cff,#ff5d52)}
.fr-champion{background:conic-gradient(#dc7ff5,#7ea4ff,#43d8c9,#dc7ff5);box-shadow:0 0 calc(var(--s)*.22) rgba(220,127,245,.55)}
.fr-founder{background:conic-gradient(#fff3cf,#f6a51e,#fff3cf,#c9820a,#fff3cf,#f6a51e,#fff3cf);box-shadow:0 0 calc(var(--s)*.18) rgba(246,165,30,.5)}
.fr-founder::after{content:"★";position:absolute;bottom:calc(var(--s)*-.06);right:calc(var(--s)*-.02);width:calc(var(--s)*.36);height:calc(var(--s)*.36);border-radius:50%;background:#f6a51e;color:#1b1206;display:grid;place-items:center;font-size:calc(var(--s)*.22);box-shadow:0 0 0 2px var(--surface)}
/* banners */
.bn-sunset{background:linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,.28)),linear-gradient(120deg,#5a1f12,#8a3b12 55%,#b0661a)}
.bn-ocean{background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.25)),linear-gradient(120deg,#0d2a47,#12506b 60%,#1b7f86)}
.bn-carbon{background:repeating-linear-gradient(45deg,#1c1c1f 0 8px,#26262b 8px 16px)}
.bn-aurora{background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.25)),linear-gradient(120deg,#1b3a2f,#274a7a 50%,#5a2a7a)}
.bn-plates{background:linear-gradient(rgba(0,0,0,.3),rgba(0,0,0,.3)),linear-gradient(90deg,#6b241d 0 33.3%,#1d3f6b 33.3% 66.6%,#44306b 66.6%)}
.bn-goldfoil{background:linear-gradient(rgba(0,0,0,.42),rgba(0,0,0,.42)),linear-gradient(120deg,#5c430c,#a87b17 45%,#e2b84a 55%,#7a5a10)}
.prof[class*="bn-"] .muted{color:#e9dcc8}
.prof[class*="bn-"] h2{color:#fff}
/* challenges */
.chal-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chrow{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.chk{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:.85rem;box-shadow:inset 0 0 0 2px var(--line)}
.chrow.done .chk{background:var(--xp);color:var(--ink);box-shadow:none}
.chrow.done>span:nth-child(2){color:var(--muted);text-decoration:line-through}
.chg{display:inline-flex;align-items:center;gap:3px;font-weight:800;font-variant-numeric:tabular-nums}
.chrow.done .chg{opacity:.45}
/* calendar review and photos */
.calhead{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:center}
.calnav{border:0;background:var(--surface-2);color:var(--fg);width:40px;height:40px;border-radius:12px;font-size:1.4rem;font-weight:800;cursor:pointer}
.calnav:disabled{opacity:.3;cursor:default}
button.cd{border:0;cursor:pointer;font-family:var(--body);position:relative;padding:0}
.phdot{position:absolute;right:5px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 1.5px var(--xp-hi)}
.dayblock{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.wphoto{width:100%;border-radius:14px;display:block}
.phslot:empty{display:none}


/* ---- v8: rarity, animated frames and banners, pixel pets ---- */
:root{--r-common:#a7b0ba;--r-rare:#4da3ff;--r-epic:#b77bff;--r-legend:#ffc53d;--r-myth:#ff5fd2;--r-origin:#ff2a4a}
.rar{font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--rc);border:1.5px solid var(--rc);border-radius:999px;padding:2px 8px;white-space:nowrap}
.rarh{color:var(--rc);display:flex;align-items:center;gap:10px}
.rarh::after{content:"";flex:1;height:2px;border-radius:1px;background:var(--rc);opacity:.35}
.rarbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.rarbar button{border:1.5px solid var(--line);background:none;color:var(--muted);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.8rem;cursor:pointer;white-space:nowrap;font-family:var(--body)}
.rarbar button[aria-pressed="true"]{border-color:var(--rc);color:var(--rc);background:color-mix(in srgb,var(--rc) 14%,transparent)}
.item{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--rc) 45%,var(--line));background:linear-gradient(160deg,color-mix(in srgb,var(--rc) 12%,var(--surface)),var(--surface) 60%)}
.item.eq{box-shadow:inset 0 0 0 2.5px var(--rc)}
.subtabs button{font-size:.98rem}
.evo{display:flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.evo span{display:flex;flex-direction:column;align-items:center;gap:4px}
.evo small{font-size:.72rem;color:var(--muted);line-height:1.2}
.evo i{font-style:normal;color:var(--muted);font-size:1.3rem}
.evo .lock img{filter:brightness(0);opacity:.55}
.sprite{image-rendering:pixelated;display:block}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%)}}
.bob{display:inline-block;animation:bob 1.6s steps(4) infinite}
.petcard{flex-direction:row;align-items:center;justify-content:space-between;gap:12px;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--rc,var(--line)) 50%,var(--line))}
.pet-l{display:flex;flex-direction:column;gap:7px;min-width:0;flex:1}
.petbtn{border:0;background:none;padding:0;cursor:pointer;flex:0 0 auto}
.hero{position:relative}
.heropet{position:absolute;right:14px;top:12px}
/* frames */
.avw .avatar{position:relative;z-index:1}
.avw::before,.avw::after{pointer-events:none;border-radius:50%}
@keyframes glowp{0%,100%{box-shadow:0 0 calc(var(--s)*.06) var(--gl)}50%{box-shadow:0 0 calc(var(--s)*.36) var(--gl)}}
@keyframes flick{0%,100%{filter:brightness(1)}40%{filter:brightness(1.4)}55%{filter:brightness(.8)}70%{filter:brightness(1.25)}}
@keyframes tw{from{opacity:.25}to{opacity:1}}
.fr-frost{background:conic-gradient(#eafcff,#7fd6ff,#eafcff,#4aa8ff,#eafcff)}
.fr-pulse{--gl:#ff4d6d;background:#ff4d6d;animation:glowp 1.6s ease-in-out infinite}
.fr-rgb,.fr-inferno{background:none}
.fr-rgb::before{content:"";position:absolute;inset:0;background:conic-gradient(#ff5d52,#ffd24a,#6fd44a,#35b6ff,#b48cff,#ff5d52);animation:spin 3s linear infinite}
.fr-orbit{background:#2b3c6e}
.fr-orbit::after{content:"";position:absolute;z-index:2;inset:calc(var(--s)*-.1);background:radial-gradient(circle calc(var(--s)*.085) at 50% calc(var(--s)*.085),#8fe6ff 60%,#3aa0e0 96%,transparent);animation:spin 3.6s linear infinite}
.fr-solar{background:#ffb23c;--gl:#ffb23c;animation:glowp 2.4s ease-in-out infinite}
.fr-solar::before{content:"";position:absolute;inset:calc(var(--s)*-.24);background:repeating-conic-gradient(rgba(255,196,84,.85) 0 5deg,transparent 5deg 30deg);-webkit-mask:radial-gradient(circle,#000 52%,transparent 71%);mask:radial-gradient(circle,#000 52%,transparent 71%);animation:spin 16s linear infinite}
.fr-thunder{background:#16224a}
.fr-thunder::before{content:"";position:absolute;inset:0;background:conic-gradient(transparent 0 40deg,#f2f8ff 44deg,#6fb6ff 54deg,transparent 62deg 180deg,#f2f8ff 186deg,#6fb6ff 196deg,transparent 206deg 300deg,#bfe0ff 304deg,transparent 312deg);animation:spin 1.2s steps(10) infinite}
.fr-thunder{--gl:#6fb6ff;animation:glowp .9s steps(3) infinite}
.fr-inferno{box-shadow:0 0 calc(var(--s)*.3) rgba(255,90,30,.65)}
.fr-inferno::before{content:"";position:absolute;inset:calc(var(--s)*-.04);background:conic-gradient(#ff3d1f,#ffb23c,#ff6a1f,#ffe07a,#ff3d1f,#ffb23c,#ff3d1f);animation:spin 2.2s linear infinite,flick .8s infinite}
.fr-lunar{background:#1b2244}
.fr-lunar::after{content:"";position:absolute;z-index:2;inset:calc(var(--s)*-.12);background:radial-gradient(circle calc(var(--s)*.1) at 50% calc(var(--s)*.1),#f6f2dc 55%,#b9b393 96%,transparent);animation:spin 8s linear infinite}
.fr-lunar::before{content:"";position:absolute;inset:calc(var(--s)*-.22);background:radial-gradient(circle 1.6px at 14% 24%,#fff 98%,transparent),radial-gradient(circle 1.2px at 86% 18%,#fff 98%,transparent),radial-gradient(circle 1.6px at 90% 74%,#fff 98%,transparent),radial-gradient(circle 1.2px at 8% 80%,#fff 98%,transparent),radial-gradient(circle 1.4px at 50% 99%,#fff 98%,transparent);animation:tw 1.4s ease-in-out infinite alternate}
.fr-mars{background:#3a1410}
.fr-mars::after{content:"";position:absolute;z-index:2;inset:calc(var(--s)*-.13);background:radial-gradient(circle calc(var(--s)*.11) at 50% calc(var(--s)*.11),#ff7a48 50%,#b8421f 96%,transparent),radial-gradient(circle calc(var(--s)*.05) at 50% calc(100% - var(--s)*.05),#ded6c6 96%,transparent);animation:spin 9s linear infinite}
.fr-founder::after{z-index:2}
.fr-clock{background:repeating-conic-gradient(#e8d9a8 0 3deg,#3a2f14 3deg 30deg)}
.fr-clock::before{content:"";position:absolute;inset:0;background:conic-gradient(#ffd24a 0 16deg,transparent 16deg);animation:spin 6s linear infinite}
.fr-clock::after{content:"";position:absolute;inset:0;background:conic-gradient(#ff6a3c 0 26deg,transparent 26deg);animation:spin 36s linear infinite}
/* banners */
@keyframes slide{to{background-position:0 0,100% 0}}
@keyframes drift{to{background-position:120px 120px,-150px 150px,90px -90px,0 0,0 0}}
@keyframes fall{to{background-position:0 120px,0 150px,0 90px,0 0}}
@keyframes rise{to{background-position:0 -120px,0 -150px,0 -90px,0 0}}
@keyframes gridm{to{background-position:0 0,0 0,0 40px,0 0}}
@keyframes sweep{from{background-position:120% 0,0 0,0 0}to{background-position:-60% 0,0 0,0 0}}
.bn-aurora{background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.25)),linear-gradient(120deg,#1b3a2f,#274a7a,#5a2a7a,#1f6a5a,#1b3a2f);background-size:auto,300% 100%;animation:slide 10s ease-in-out infinite alternate}
.bn-stars{background:radial-gradient(1.6px 1.6px at 20px 30px,#fff,transparent),radial-gradient(1.6px 1.6px at 90px 70px,#cfe3ff,transparent),radial-gradient(1.1px 1.1px at 50px 60px,#fff,transparent),linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.15)),linear-gradient(120deg,#0b1030,#1d2152);background-size:120px 120px,150px 150px,90px 90px,auto,auto;animation:drift 22s linear infinite}
.bn-snow{background:radial-gradient(2.2px 2.2px at 20px 30px,#fff,transparent),radial-gradient(1.8px 1.8px at 90px 70px,#e6f4ff,transparent),radial-gradient(1.4px 1.4px at 50px 60px,#fff,transparent),linear-gradient(#2c4a6e,#13233a);background-size:120px 120px,150px 150px,90px 90px,auto;animation:fall 7s linear infinite}
.bn-embers{background:radial-gradient(2px 2px at 20px 30px,#ffb23c,transparent),radial-gradient(1.6px 1.6px at 90px 70px,#ff6a1f,transparent),radial-gradient(1.3px 1.3px at 50px 60px,#ffe07a,transparent),linear-gradient(#2a0d08,#571a0c);background-size:120px 120px,150px 150px,90px 90px,auto;animation:rise 6s linear infinite}
.bn-neon{background:linear-gradient(rgba(12,0,30,.35),rgba(12,0,30,.35)),repeating-linear-gradient(90deg,rgba(255,60,200,.4) 0 2px,transparent 2px 40px),repeating-linear-gradient(0deg,rgba(60,220,255,.38) 0 2px,transparent 2px 40px),linear-gradient(#1a0533,#3a0a5e);animation:gridm 2.4s linear infinite}
.bn-galaxy{background:radial-gradient(1.6px 1.6px at 20px 30px,#fff,transparent),radial-gradient(1.4px 1.4px at 90px 70px,#ffd9f5,transparent),radial-gradient(1.1px 1.1px at 50px 60px,#cfe3ff,transparent),radial-gradient(ellipse at 28% 40%,rgba(190,90,255,.6),transparent 60%),radial-gradient(ellipse at 78% 62%,rgba(50,150,255,.55),transparent 55%) #070818;background-size:120px 120px,150px 150px,90px 90px,auto,auto;animation:drift 30s linear infinite}
.bn-goldfoil{background:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.4) 50%,transparent 58%),linear-gradient(rgba(0,0,0,.42),rgba(0,0,0,.42)),linear-gradient(120deg,#5c430c,#a87b17 45%,#e2b84a 55%,#7a5a10);background-size:250% 100%,auto,auto;background-repeat:no-repeat;animation:sweep 3.2s ease-in-out infinite}
.bn-rgbwave{background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),linear-gradient(90deg,#ff5d52,#ffd24a,#6fd44a,#35b6ff,#b48cff,#ff5d52,#ffd24a);background-size:auto,300% 100%;animation:slide 6s linear infinite alternate}


/* ---- v9: accounts, friends, groups ---- */
.tab{font-size:.6rem;position:relative}
.tab svg{width:22px;height:22px}
.tbadge,.nbadge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--push);color:#fff;font-size:.68rem;font-weight:800;line-height:1}
.tbadge{position:absolute;top:2px;right:calc(50% - 22px)}
.authf{display:flex;flex-direction:column;gap:12px}
.authf label{display:flex;flex-direction:column;gap:6px}
.authf small{font-size:.8rem}
.formerr{color:var(--push);font-weight:600;font-size:.88rem}
.okhint{color:var(--xp);font-weight:600;font-size:.8rem}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:7px;vertical-align:1px}
.sdot.ok{background:#3ccf85}.sdot.warn{background:var(--warn)}
.fhero ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.fhead{display:flex;align-items:center;gap:10px}
.fh-t{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.25}
.fh-t .muted{font-size:.8rem}
.fsearch{display:flex;gap:8px}
.fsearch .txt{flex:1;min-width:0}
.prow{display:flex;align-items:center;gap:10px;padding-block:9px;border-top:1px solid var(--line)}
.panel h3+.prow{border-top:0}
.prow-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:none;padding:0;text-align:left;cursor:pointer;color:var(--fg);font-family:var(--body)}
.prow-t{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.prow-t b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow-t .muted,.pstat{font-size:.82rem}
.pstat{color:var(--muted)}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3ccf85;margin-right:6px;box-shadow:0 0 0 3px rgba(60,207,133,.25)}
.feed{display:flex;flex-direction:column;gap:8px}
.fitem{display:flex;gap:12px;align-items:flex-start;text-align:left;border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:16px;padding:12px;cursor:pointer;color:var(--fg);font-family:var(--body);font-size:.95rem}
.ftxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;line-height:1.35}
.fsub{color:var(--muted);font-size:.85rem}
.ftime{color:var(--muted);font-size:.75rem}
.gcard{display:flex;flex-direction:column;gap:12px;text-align:left;border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:18px;padding:14px;cursor:pointer;color:var(--fg);font-family:var(--body)}
.gc-top{display:flex;align-items:center;gap:12px}
.gc-t{display:flex;flex-direction:column;flex:1;min-width:0}
.gc-t b{font-size:1.1rem}
.gc-t .muted{font-size:.85rem}
.gc-badge{position:relative;flex:0 0 auto;width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--xp),var(--push));color:var(--ink);display:grid;place-items:center;font-weight:900;font-size:1.4rem}
.gc-badge i{position:absolute;right:-6px;bottom:-6px;font-style:normal;min-width:22px;height:22px;padding:0 4px;border-radius:999px;background:var(--fg);color:var(--bg);font-size:.72rem;font-weight:900;display:grid;place-items:center}
.gc-badge.big{width:64px;height:64px;font-size:2rem;border-radius:18px}
.gc-goal{display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.gdh{display:flex;align-items:center;gap:16px}
.codebox{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface-2);border-radius:14px;padding:12px 14px}
.codebox>span{display:flex;flex-direction:column}
.gcode{font-size:1.5rem;letter-spacing:.2em;font-variant-numeric:tabular-nums}
.lb{display:flex;flex-direction:column;gap:6px}
.lbrow{display:flex;align-items:center;gap:10px;border:0;background:var(--surface-2);border-radius:12px;padding:8px 12px 8px 8px;text-align:left;cursor:pointer;color:var(--fg);font-family:var(--body)}
.lbrow .prow-t{flex:1}
.lbn{width:22px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.lbrow:first-child .lbn{color:var(--xp)}
.stats.s2{grid-template-columns:repeat(2,minmax(0,1fr))}
html{min-height:100%;-webkit-text-size-adjust:100%}
/* Allow scrolling only: no pinch or double-tap zoom. Set on every element because scrolling panels reset it. */
*{touch-action:pan-x pan-y}
body{min-height:100vh;min-height:calc(100vh - env(safe-area-inset-top,0px))}
.txt.locked{opacity:.6}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- v12: chests, items, rotating shop ---- */
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ph .link{align-self:center}
.chestrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chestbtn{border:0;cursor:pointer;font-family:var(--body);color:var(--fg);border-radius:16px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;
  background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--rc) 26%,transparent),transparent 70%),var(--surface-2);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--rc) 50%,var(--line))}
.chestbtn b{font-size:.92rem}
.chestbtn .price{padding:3px 10px;font-size:.85rem;background:var(--bg)}
.invrow{display:flex;align-items:center;gap:10px;padding-block:8px;border-top:1px solid var(--line)}
.panel .ph+.invrow{border-top:0}
.inv-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.inv-t .muted{font-size:.8rem}
.odds{display:flex;flex-direction:column;gap:2px}
.odrow{display:flex;align-items:center;gap:10px;padding:6px 2px;border-top:1px solid var(--line);font-weight:600;font-size:.92rem}
.odrow:first-child{border-top:0}
.odrow i{width:10px;height:10px;border-radius:3px;background:var(--rc);flex:0 0 auto}
.odrow span{flex:1;min-width:0}
.odrow b{font-variant-numeric:tabular-nums}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cdn{font-size:.8rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.price s,.gemn s{opacity:.6;font-weight:700;margin-right:2px}
.gemn s{font-size:1.1rem}
.boostchip{display:inline-block;font-size:.72rem;font-weight:900;color:var(--ink);background:var(--xp);border-radius:999px;padding:1px 7px;vertical-align:1px}
.chestopen{display:flex;flex-direction:column;align-items:center;gap:10px;padding:24px 0}
.shake{animation:shake .5s ease-in-out infinite;filter:drop-shadow(0 0 18px color-mix(in srgb,var(--rc) 70%,transparent))}
@keyframes shake{0%,100%{transform:rotate(0) scale(1)}20%{transform:rotate(-7deg) scale(1.04)}40%{transform:rotate(6deg) scale(1.06)}60%{transform:rotate(-5deg) scale(1.08)}80%{transform:rotate(4deg) scale(1.1)}}
.reveal{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:12px 0 4px;overflow:hidden}
.reveal h2{margin:0}
.reveal p{margin:0;max-width:300px}
.rays{position:absolute;left:50%;top:78px;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(color-mix(in srgb,var(--rc) 40%,transparent) 0 9deg,transparent 9deg 24deg);-webkit-mask:radial-gradient(circle,#000 18%,transparent 66%);mask:radial-gradient(circle,#000 18%,transparent 66%);animation:spin 14s linear infinite}
.rv-pic{position:relative;min-height:120px;display:grid;place-items:center;filter:drop-shadow(0 0 16px color-mix(in srgb,var(--rc) 75%,transparent))}
.pop{animation:popin .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{from{transform:scale(.2) rotate(-10deg);opacity:0}to{transform:none;opacity:1}}
.fr-hoard{background:conic-gradient(#ffcf4a,#b8741a,#ffe9a0,#c98a1c,#ffcf4a);--gl:#ffcf4a;animation:glowp 2s ease-in-out infinite}
.fr-hoard::before{content:"";position:absolute;inset:calc(var(--s)*-.2);background:radial-gradient(circle 2px at 20% 18%,#fff6c8 98%,transparent),radial-gradient(circle 1.6px at 82% 26%,#ffe08a 98%,transparent),radial-gradient(circle 2px at 76% 86%,#fff6c8 98%,transparent),radial-gradient(circle 1.4px at 14% 74%,#ffe08a 98%,transparent),radial-gradient(circle 1.6px at 50% 2%,#fff 98%,transparent);animation:tw 1.1s ease-in-out infinite alternate,spin 10s linear infinite}
.bn-vault{background:radial-gradient(circle 2px at 30px 20px,#fff3b0,transparent),radial-gradient(circle 1.5px at 90px 60px,#ffd96a,transparent),radial-gradient(ellipse at 50% 120%,rgba(255,196,60,.55),transparent 60%),linear-gradient(180deg,#2a1a08,#4a2e0c 60%,#7a4e12);background-size:120px 80px,150px 100px,auto,auto;animation:rise 6s linear infinite}

/* ---- v12: chat ---- */
.crow{width:100%;display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 0;border-top:1px solid var(--line);color:var(--fg);text-align:left;cursor:pointer;font-family:var(--body)}
.chats .crow:first-child{border-top:0}
.crow-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.crow-t b,.crow-t .muted{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow-t .muted{font-size:.86rem}
.crow.un .crow-t .muted{color:var(--fg);font-weight:700}
.crow-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto}
.udot{width:10px;height:10px;border-radius:50%;background:var(--xp)}
.chat{position:fixed;left:0;right:0;top:0;height:100%;z-index:26;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.chat[hidden]{display:none}
body.chatting{overflow:hidden}
body.chatting .tabs,body.chatting .rest{display:none}
.chat-h{display:flex;align-items:center;gap:6px;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--surface);flex:0 0 auto}
.chat-who{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--fg);text-align:left;cursor:pointer;font-family:var(--body);padding:4px 0}
.chat-who .gc-badge{width:36px;height:36px;font-size:1.1rem;border-radius:11px}
.chat-who .prow-t .muted{font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

function migrate(s){
  if(!s||!s.sessions)return null;
  if(s.v===1){
    for(const k in s.sessions){const se=s.sessions[k];
      if(!se.ex){se.ex=defaultTpl(se.day);const ns={};
        for(const sk in se.sets||{}){const [j,i]=sk.split("-");ns[`d${se.day}-${j}|${i}`]=se.sets[sk]}

}

  if(!s||s.mod)return s;
  const t=clone(tpl(s.day)),tu=new Set(t.map(x=>x.u));
  const extra=(s.ex||[]).filter(sl=>!tu.has(sl.u)&&slotDone(s,sl.u));
  s.ex=t.concat(extra);return s;
}

  const k=sessKey(today(),current);let s=state.sessions[k];

}

  const k=EX[x]?.kind;
  if(k==="load")return e1rm(set.w||0,set.r||0);

  if(k==="reps")return set.r||0;

function compute(){

  const best={},first={},hist={},prs=[],Lb={},stepB={},rankUps=[];let sets=0,finished=0,volume=0,warm=0,drops=0,bonusXP=0;const weeks={},dates=new Set(),times=[];

    for(const set of doneSets(s)){
      if(set.t==="w"){warm++;continue}

      const L=levelL(x,sc,s.date);if(L!=null)Lb[x]=Math.max(Lb[x]||0,L);
      const st=L!=null?stepOf(Lb[x]):progStep(best[x]/first[x]-1);

  let streak=0,w=weekStart(today());
  if(!(weeks[w]&&weeks[w].size>=WT))w=addDays(w,-7);
  while(weeks[w]&&weeks[w].size>=WT){streak++;w=addDays(w,-7)}

  const perfect=Object.values(weeks).some(s=>s.size>=TDAYS);
  const tierOf=x=>first[x]==null?null:{step:stepB[x],i:Math.floor(stepB[x]/3),L:Lb[x]??null,g:best[x]/first[x]-1};
  const ctx={TDAYS,WT,best,first,hist,prs,sets,finished,volume,warm,drops,streak,bestStreak,dstreak,perfect,tierOf,stepB,rankUps,dates,times,bonusXP,cardio};
  const badgeXP=Object.keys(state.earned).reduce((a,id)=>a+(BADGES.find(b=>b.id===id)?.xp||0),0);
  const xp=sets*10+prs.length*50+finished*100+rankUps.length*40+badgeXP+bonusXP+cardio.xp+(state.bx||0);

function commit(mut,opts={}){
  const before=compute();mut();
  let after=compute();const newBadges=[];
  for(const b of BADGES)if(!state.earned[b.id]&&badgeDone(b,after)){state.earned[b.id]=today();newBadges.push(b)}
  if(newBadges.length)after=compute();
  const dPet=(after.sets-before.sets)*5+(after.prs.length-before.prs.length)*25+(after.finished-before.finished)*50+Math.max(0,after.cardio.pet-before.cardio.pet);if(dPet>0)gainPet(dPet);
  save();
  const newRanks=after.rankUps.filter(r=>!before.rankUps.some(o=>o.k===r.k&&o.x===r.x&&o.to===r.to));
  if(!opts.quiet){
    const oldKeys=new Set(before.prs.map(p=>p.k+p.x));
    after.prs.filter(p=>!oldKeys.has(p.k+p.x)).forEach(p=>{
      const s=p.set,k=EX[p.x]?.kind;
      const what=k==="reps"?`${s.r} reps`:k==="bw"?`+${kg(s.w||0)} kg × ${s.r}`:`${kg(s.w)} kg × ${s.r}`;
      toast("PR",`New PR · ${exName(p.x)}`,what,"+50");
    });
    newRanks.forEach(r=>toast("▲",`Rank up · ${stepName(r.to)}`,exName(r.x),"+40"));
    const oldC=new Set(before.cardio.cprs.map(p=>p.id+p.k));after.cardio.cprs.filter(p=>!oldC.has(p.id+p.k)).forEach(p=>{const e=EFF.find(x=>x[0]===p.k);toast("PR",`New ${e[1]} PB`,`${fmtDur(p.sec)} · ${fmtDur(p.prev-p.sec)} faster`,"+50");postActivity("pr",{x:e[1]+" run",k:"time",sec:p.sec})});
    const oldR=new Set(before.cardio.crank.map(r=>r.id+r.to));after.cardio.crank.filter(r=>!oldR.has(r.id+r.to)).forEach(r=>{toast("▲",`Running rank · ${stepName(r.to)}`,"Your 5K equivalent got faster","+40");postActivity("rank",{x:"Running",step:r.to})});
    newBadges.forEach(b=>toast(b.glyph,`Medal unlocked · ${b.name}`,b.hint||"",`+${b.xp}`));
    if(after.level>before.level&&!opts.noLevelModal)toast(String(after.level),`Level up · Level ${after.level}`,`${after.title}. +${(after.level-before.level)*25} gems.`,"");
  }
  cloudEvents(before,after,newBadges,newRanks);
  return {before,after,newBadges,newRanks};
}

function lastFor(x,beforeKey){
  const list=sortedSessions().filter(s=>s.k!==beforeKey&&s.date<=today());
  for(let i=list.length-1;i>=0;i--){const sets=Object.values(list[i].sets||{}).filter(s=>s.x===x&&s.done&&!s.t);if(sets.length)return {date:list[i].date,sets}}
  return null;
}
function coach(sl,last){
  const x=sl.id,kind=EX[x]?.kind,rg=range(sl.reps),nsets=sl.sets;
  if(kind==="none"||!kind)return null;
  if(!last)return {w:"",r:rg?rg.lo:"",msg:kind==="reps"?"First time: log how many you get.":`First time: pick a weight you can lift for ${rg?rg.lo:"the target"} reps.`};
  const ws=last.sets.map(s=>s.w||0),rs=last.sets.map(s=>s.r||0),topW=Math.max(...ws);
  if(kind==="reps"){const b=Math.max(...rs);return {w:"",r:b+1,msg:`Beat last time: aim for <b>${b+1}</b>.`}}
  const atTop=last.sets.filter(s=>(s.w||0)===topW);
  const allTop=rg&&last.sets.length>=nsets&&last.sets.every(s=>(s.r||0)>=rg.hi);
  if(allTop){const db=DB.has(x),nw=topW+(db?2:2.5);return {w:nw,r:rg.lo,up:true,msg:`Level up: every set hit ${rg.hi}. Go to <b>${kg(nw)} kg</b>${kind==="bw"?" added":""}${db?" (or the next dumbbell up)":""} for ${rg.lo}+.`}}
  const bestR=Math.max(...atTop.map(s=>s.r||0));const tgt=rg?Math.min(rg.hi,bestR+1):bestR+1;
  return {w:topW,r:tgt,msg:`Beat last time: <b>${kg(topW)} kg</b>${kind==="bw"?" added":""} for <b>${tgt}</b> reps.`};
}

function lineChart(id,pts,opts={}){
  if(pts.length<2)return `<p class="muted">Log this lift in ${2-pts.length} more session${pts.length===1?"":"s"} to draw a chart.</p>`;
  const W=340,H=170,L=34,R=40,T=14,B=24;
  const ys=pts.map(p=>p.y).concat((opts.avg||[]).map(a=>a.y)).filter(v=>v!=null);
  let lo=Math.min(...ys),hi=Math.max(...ys);const pad=Math.max((hi-lo)*.15,hi*.02,.5);lo-=pad;hi+=pad;
  const step=niceStep((hi-lo)/3),t0=Math.ceil(lo/step)*step,ticks=[];for(let v=t0;v<=hi;v+=step)ticks.push(+v.toFixed(2));
  const X=i=>L+(W-L-R)*(i/(pts.length-1)),Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let s=`<svg class="chart" id="${id}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||"Chart")}">`;
  ticks.forEach(v=>{s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${kg(v)}</text>`});
  s+=`<text x="${L}" y="${H-6}">${esc(pts[0].label)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${esc(pts[pts.length-1].label)}</text>`;
  if(opts.avg){const a=opts.avg.map((p,i)=>p.y==null?null:`${X(i)},${Y(p.y)}`).filter(Boolean);if(a.length>1)s+=`<polyline class="ln avg" points="${a.join(" ")}"/>`}
  if(!opts.dotsOnly)s+=`<polyline class="ln" points="${pts.map((p,i)=>`${X(i)},${Y(p.y)}`).join(" ")}"/>`;
  pts.forEach((p,i)=>{s+=`<circle class="pt${opts.dotsOnly?" raw":p.pr?" pr":""}" cx="${X(i)}" cy="${Y(p.y)}" r="${opts.dotsOnly?3.5:p.pr?5:4}"/>`});
  const last=pts[pts.length-1];s+=`<text class="endlbl" x="${X(pts.length-1)+8}" y="${Y(last.y)+4}">${kg(Math.round(last.y*10)/10)}</text>`;
  pts.forEach((p,i)=>{s+=`<rect class="hit" x="${X(i)-12}" y="${T}" width="24" height="${H-T-B}" data-x="${X(i)}" data-y="${Y(p.y)}" data-t="${esc(p.label+" · "+kg(Math.round(p.y*10)/10)+(opts.unit||""))}"/>`});
  s+=`<g class="tip" visibility="hidden"><rect class="tipbg" rx="6" height="20"/><text class="tiptx"></text></g></svg>`;
  return s;
}

// Tier boundaries as multiples of an "intermediate" standard for each lift. Each tier splits into I, II, III (III is highest).
const TB=[0,.55,.75,1,1.25,1.5,1.75],ROMAN=["I","II","III"],PT=[0,.05,.10,.20,.35,.50];
function stepOf(L){if(!(L>0))return 0;for(let t=5;t>=0;t--)if(L>=TB[t]){const f=Math.min(.9999,(L-TB[t])/(TB[t+1]-TB[t]));return t*3+Math.floor(f*3)}return 0}
const stepLo=s=>{const t=Math.floor(s/3),k=s%3;return TB[t]+(TB[t+1]-TB[t])*k/3};
const stepName=s=>TIERS[Math.floor(s/3)].n+" "+ROMAN[s%3];
const tierVar=s=>TIERS[Math.floor(s/3)].v;
const progStep=g=>{let t=0;PT.forEach((v,i)=>{if(g>=v-1e-9)t=i});return t*3};

  const pr=PRESETS.find(q=>q.id===presetId),np={id:uid(),name:name||pr.name,builtin:!pr.days,days:{},tpl:{}};
  if(pr.days)pr.days.forEach((dy,d)=>{np.days[d]={name:dy.name,tag:dy.tag,type:dy.type,focus:dy.focus,time:""};
    np.tpl[d]=dy.ex.map(([x,sets,reps])=>({u:uid(),id:x,sets,reps,note:""}))});
  save();
  // a brand-new user replacing the untouched built-in plan shouldn't keep it as a second plan
  const only=state.plans.length===1&&state.plans[0];
  if(only&&only.builtin&&pr.days&&!Object.keys(only.days||{}).length&&!Object.keys(only.tpl||{}).length&&!Object.keys(state.sessions).length)state.plans=[];
  state.plans.push(np);state.welcomed=true;

function seedRand(seed){let h=2166136261>>>0;for(const ch of seed)h=Math.imul(h^ch.charCodeAt(0),16777619)>>>0;
  return ()=>{h=(h+0x6D2B79F5)>>>0;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296}}

const WEEK_N={frame:6,banner:4,theme:3,title:6};

function weeklySet(kind){

  for(let r=0;r<4;r++){const f=sh.find(i=>i.r===r);if(f)pick.push(f)}
  for(const it of sh){if(pick.length>=WEEK_N[kind])break;if(!pick.includes(it))pick.push(it)}
  return pick.slice(0,WEEK_N[kind]).sort((a,b)=>a.r-b.r||a.price-b.price);
}
const DEAL_OFF=.3;
function dailyDeals(){

function useItem(id){
  const v=inv();if(!(v[id]>0))return;

// Missed days get covered by freezes when the app opens, as long as there are enough to bridge the whole gap.
function useFreezes(){
  const have=inv().freeze||0;if(!have)return;
  const c=compute(),fz=state.frozen||(state.frozen={});let d=addDays(today(),-1);const gap=[];
  for(let i=0;i<10&&!c.dates.has(d);i++){if(parseD(d).getDay()!==0&&!fz[d])gap.push(d);d=addDays(d,-1)}
  if(!c.dates.has(d)||!gap.length||gap.length>have)return;

}

const EGG_ART={
  lunapet:{base:"#f0dfc2",cap:"#3d2519",spot:"#3d2519",gem:"#9fd0f5"},
  hollow:{base:"#2a2631",spot:"#c3122f",vein:1,mask:"#efe9e2"},
  oriel:{base:"#d6e4ff",spot:"#b9a6ff",gem:"#4fd8ff"},
  bloomlet:{base:"#e4f8d6",spot:"#ff8fb8",cap:"#ff8fb8"},

};
function capPts(cx,cy,rx,ry,cut){const pts=[];for(let i=0;i<=48;i++){const t=Math.PI+Math.PI*i/48,x=cx+rx*Math.cos(t),y=cy+ry*Math.sin(t);if(y<=cut)pts.push([x,y])}
  const zig=[];for(let x=pts[pts.length-1][0];x>pts[0][0];x-=2.2)zig.push([x,cut+((zig.length%2)?1.6:0)]);return pts.concat(zig)}
const CRACKS=[[],
  [[19,7],[20,8],[19,9],[20,10],[21,11]],
  [[19,7],[20,8],[19,9],[20,10],[21,11],[22,12],[21,13],[22,14],[18,10],[17,11],[16,12]],
  [[19,7],[20,8],[19,9],[20,10],[21,11],[22,12],[21,13],[22,14],[18,10],[17,11],[16,12],[6,17],[7,16],[8,17],[9,18],[10,17],[11,16],[12,17],[13,18],[14,17],[15,16],[16,17],[17,18],[18,17],[19,16],[20,17],[21,18],[22,17],[23,16],[24,17],[25,18],[26,17],[22,15],[23,16]]];
function eggDef(id,st){
  const p=(SPR[id+"0"]||{}).pal||{},A=EGG_ART[id]||{},base=A.base||p.a||"#f0e0c0",spot=A.spot||p.d||p.b||"#c08040";
  const pal={a:base,s:spot,c:A.cap||spot,v:A.mask||"#ffffff",g:A.gem||"#ffffff",l:"#fff3b0"};
  const parts=[E(16,17.6,10.4,13,"a")];
  if(A.cap)parts.push(PG(capPts(16,17.6,10.4,13,10.5),"c",{n:1}));
  if(A.vein){parts.push(PG([[8,9],[14,6],[15,15],[9,17]],"v",{n:1}),DOT([[18,8],[19,9],[19,10],[20,11],[21,12],[20,13],[21,14],[22,15],[22,16],[11,20],[12,21],[12,22],[13,23],[14,24],[22,22],[23,23],[23,24],[24,25],[17,26],[16,27]],"s"),DOT([[10,11],[11,12]],"#c3122f"))}
  else parts.push(E(10.6,21.6,2.4,2,"s",{n:1}),E(21,22.6,2.8,2.3,"s",{n:1}),E(15.6,27,1.8,1.4,"s",{n:1}),...(A.cap?[]:[E(20.6,11.6,2,1.7,"s",{n:1}),E(12.6,9.6,1.5,1.3,"s",{n:1})]));
  if(A.gem)parts.push(E(16,15.6,1.6,1.6,"g",{n:1}),DOT([[15,15]],"W"));
  parts.push(DOT([[9,9],[10,8],[9,10]],"W"));
  if(st>0)parts.push(DOT(CRACKS[st],"K"));
  if(st>=3)parts.push(DOT(CRACKS[3].filter(([x,y])=>y>=15&&y<=18).map(([x,y])=>[x,y-1]).filter(([x,y])=>!CRACKS[3].some(c=>c[0]===x&&c[1]===y)),"l"));
  return {pal,parts};
}
const eggKey=(id,st)=>{const k="egg_"+id+"_"+st;if(!SPR[k])SPR[k]=eggDef(id,st);return k};

function ago(isoStr){

}

async function loadSocial(force){

      sb.from("activity").select("*").gte("created_at",new Date(Date.now()-7*864e5).toISOString()).order("created_at",{ascending:false}).limit(80),
      sb.from("messages").select("*").order("id",{ascending:false}).limit(300)]);

    if(!ms.error){takeMsgs(ms.data);chat.ready=true}

    const ids=new Set([me.id]);fr.data.forEach(f=>{ids.add(f.requester);ids.add(f.addressee)});gm.data.forEach(x=>ids.add(x.user_id));fd.data.forEach(a=>ids.add(a.user_id));
    const idl=[...ids];
    const [pr,st,gr]=await Promise.all([sb.from("profiles").select("id,username,avatar,frame,title,level").in("id",idl),
      sb.from("user_stats").select("id,stats,updated_at").in("id",idl),myG.length?sb.from("groups").select("*").in("id",myG):Promise.resolve({data:[]})]);
    for(const r of [pr,st,gr])if(r.error)throw r.error;
    social.profiles=Object.fromEntries(pr.data.map(p=>[p.id,p]));social.stats=Object.fromEntries(st.data.map(s=>[s.id,{...s.stats,_at:s.updated_at}]));

}

/* ---------- Chat with friends and groups ---------- */
// Conversations are "dm:<friend id>" or "g:<group id>". Read position is the last message id seen, kept on this phone.
const chat={open:null,msgs:{},last:{},maxId:0,ready:false,chan:null,seen:new Set(),tick:0};
const readMap=()=>lsGet("vtppl-read")||{};
const convOf=m=>m.group_id?"g:"+m.group_id:"dm:"+(m.sender===me.id?m.to_user:m.sender);
const convOK=k=>k.startsWith("dm:")?friendIds().includes(k.slice(3)):social.groups.some(g=>"g:"+g.id===k);
const pushTag=k=>k.startsWith("dm:")?"dm-"+k.slice(3):"grp-"+k.slice(2);
const isUnread=(k,r=readMap())=>{const m=chat.last[k];return !!m&&m.sender!==me.id&&m.id>(r[k]||0)};
const unreadCount=()=>{if(!me||!chat.ready)return 0;const r=readMap();return Object.keys(chat.last).filter(k=>convOK(k)&&isUnread(k,r)).length};
function markRead(k){const m=chat.last[k];if(!m)return;const r=readMap();if((r[k]||0)<m.id){r[k]=m.id;lsSet("vtppl-read",r)}
  if(sb&&me)sb.from("push_queue").delete().eq("user_id",me.id).eq("tag",pushTag(k)).then(()=>{},()=>{});updateBadges()}
function takeMsgs(rows){
  for(const m of rows){if(chat.seen.has(m.id))continue;chat.seen.add(m.id);const k=convOf(m);
    if(!chat.last[k]||chat.last[k].id<m.id)chat.last[k]=m;if(m.id>chat.maxId)chat.maxId=m.id}
}
function onMsg(m){
  if(!m||!me||chat.seen.has(m.id))return;
  takeMsgs([m]);const k=convOf(m),list=chat.msgs[k];
  if(list){const t=list.findIndex(x=>x.temp&&x.sender===m.sender&&x.body===m.body);if(t>=0)list.splice(t,1);if(!list.some(x=>x.id===m.id))list.push(m)}
  if(chat.open===k&&!document.hidden){markRead(k);renderChatMsgs(true)}
  else if(m.sender!==me.id){
    // A message from a new friend or group we don't know about yet: refresh the friends list first.
    if(convOK(k))msgToast(m);else loadSocial(true).then(()=>{if(convOK(k))msgToast(m)});
  }
  updateBadges();if(view==="friends"&&friendTab==="chats"&&!chat.open)renderFriends();
}
function msgToast(m){const p=social.profiles[m.sender],g=m.group_id&&social.groups.find(x=>x.id===m.group_id);
  toast("✉",g?g.name:"@"+(p?.username||"friend"),(g?"@"+(p?.username||"")+": ":"")+m.body.slice(0,80),"");updateBadges()}
function startLive(){

}

// Live updates arrive instantly when available; this check every few seconds is the backup.
async function pollMsgs(){
  if(!sb||!me||!chat.ready||document.hidden)return;

  const {data,error}=await sb.from("messages").select("*").gt("id",chat.maxId).order("id").limit(100);

const CTYPES={

const fmtKm=km=>(Math.round(km*100)/100).toString();
const cMin=s=>(s.sec||0)/60;
function cardioCalc(dates,weeks){

    if(dates){dates.add(s.date);const w=weekStart(s.date);(weeks[w]=weeks[w]||new Set()).add("c"+s.date)}

      for(const [k,,d] of EFF){if(s.dist>=d-1e-6&&s.dist<=d*1.1){const t=s.sec*d/s.dist;
        if(!best[k])best[k]={sec:t,date:s.date,id:s.id};else if(t<best[k].sec-.5){cprs.push({k,date:s.date,id:s.id,sec:t,prev:best[k].sec});best[k]={sec:t,date:s.date,id:s.id};sx+=50}}}

function cardioSummary(s){
  const T=CTYPES[s.type]||CTYPES.other;
  if(T.dist)return `${s.dist?fmtKm(s.dist)+" km · ":""}${fmtDur(s.sec)}${s.dist&&s.sec?" · "+fmtPace(s.sec,s.dist):""}`;
  if(T.sprint)return `${s.reps||0} × ${s.each||0} m${s.bestRep?` · best ${s.bestRep}s`:""}${s.sec?" · "+fmtDur(s.sec):""}`;
  if(T.moves)return `${s.rounds?s.rounds+" rounds · ":""}${fmtDur(s.sec)}${s.moves&&s.moves.length?" · "+s.moves.map(m=>`${m.r} ${m.n.toLowerCase()}`).join(", "):""}`;
  return fmtDur(s.sec);
}

function barChart(pts,unit){
  const W=340,H=150,L=8,R=8,T=18,B=22,mx=Math.max(1,...pts.map(p=>p.y)),bw=(W-L-R)/pts.length;
  return `<svg class="chart bars" viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart">${pts.map((p,i)=>{const h=(H-T-B)*p.y/mx,x=L+i*bw+bw*.18,last=i===pts.length-1;
    const lbl=pts.length<=8||(pts.length-1-i)%2===0;
    return `${p.y>0?`<rect class="bar${last?" now":""}" x="${x}" y="${H-B-Math.max(h,3)}" width="${bw*.64}" height="${Math.max(h,3)}" rx="${Math.min(4,bw*.2)}"/><text x="${x+bw*.32}" y="${H-B-Math.max(h,3)-5}" text-anchor="middle">${p.y>=1000?(p.y/1000).toFixed(1)+"k":fmtKm(Math.round(p.y*10)/10)}</text>`:`<rect class="bar zero" x="${x}" y="${H-B-2}" width="${bw*.64}" height="2"/>`}${lbl?`<text x="${x+bw*.32}" y="${H-6}" text-anchor="middle">${esc(p.label)}</text>`:""}`}).join("")}</svg>`;
}
const parseTime=(h,m,s)=>(+h||0)*3600+(+m||0)*60+(+s||0);

/* ---------- Today: recovery and daily KPIs ---------- */
const GDEF={steps:10000,water:2500,sleep:8,kcal:0,protein:0};
const goals=()=>{const g={...GDEF,...(state.goals||{})};if(!g.protein)g.protein=Math.round((latestBW()||77)*2/5)*5;return g};
const dayRec=(d=today())=>(state.daily||{})[d]||{};
function setDay(d,patch){state.daily=state.daily||{};state.daily[d]={...(state.daily[d]||{}),...patch};for(const k of Object.keys(state.daily[d]))if(state.daily[d][k]==null||state.daily[d][k]==="")delete state.daily[d][k]}
// Training load per day: working sets plus cardio minutes (a 30-minute run counts like 10 sets).
function loadOn(d){let n=0;for(const s of Object.values(state.sessions))if(s.date===d)n+=doneSets(s).filter(x=>x.t!=="w").length;
  for(const s of Object.values(state.cardio||{}))if(s.date===d)n+=cMin(s)/3*((s.rpe||6)/6);return n}
function recovery(){
  const d=today(),r=dayRec(d),g=goals(),parts=[],sl=r.sleep;
  const sleepPts=sl==null?28:Math.round(40*Math.min(1,Math.max(0,(sl-4)/(g.sleep-4))));parts.push(["Sleep",sleepPts,40,sl==null?"not logged":`${sl} h`]);
  const en=r.energy,so=r.sore;
  const enPts=en==null?10:Math.round((en-1)/4*20),soPts=so==null?10:Math.round((5-so)/4*20);
  parts.push(["Energy",enPts,20,en==null?"not logged":["","Drained","Low","OK","Good","Great"][en]]);parts.push(["Soreness",soPts,20,so==null?"not logged":["","None","Mild","Some","Sore","Very sore"][so]]);
  const recent=loadOn(addDays(d,-1))+loadOn(addDays(d,-2));let base=0;for(let i=3;i<17;i+=2)base+=loadOn(addDays(d,-i))+loadOn(addDays(d,-i-1));base/=7;
  const ratio=base>0?recent/base:recent>0?1.5:0,ldPts=Math.round(20*Math.max(0,Math.min(1,2-ratio)));parts.push(["Training load",ldPts,20,!recent?"rested":ratio>1.4?"higher than usual":ratio<.7?"lighter than usual":"normal"]);
  const score=parts.reduce((a,p)=>a+p[1],0),missing=sl==null||en==null||so==null;
  const lab=score>=70?["Ready to go","Good day to push hard or chase a PR.","--good"]:score>=45?["Train smart","Train as planned, but don't force PRs.","--xp"]:["Take it easy","Go lighter, add mobility or a walk, and sleep early.","--push"];
  return {score,parts,missing,lab};
}

    <text x="50%" y="${sub?"47%":"54%"}" text-anchor="middle" class="rg-n">${esc(label)}</text>${sub?`<text x="50%" y="66%" text-anchor="middle" class="rg-s">${esc(sub)}</text>`:""}</svg>`}
